# Keep Supabase free tier active by pinging the site every 5 days.
# Supabase pauses projects after 7 days of inactivity.
# Uses ~2 min/month of GitHub Actions (free tier: 2000 min for private repos).

name: Keep Supabase Alive

on:
  schedule:
    # Run every Sunday and Wednesday at 12:00 UTC
    - cron: '0 12 * * 0,3'
  workflow_dispatch: # Allow manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.KEEP_ALIVE_SECRET }}" "${{ secrets.SITE_URL }}/api/keep-alive")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          echo "Status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Keep-alive failed with status $http_code"
            exit 1
          fi
          echo "Keep-alive OK - Supabase will stay active"
